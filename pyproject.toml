[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opc-finance-box"
version = "0.1.0"
description = "Composable, editable AI-native finance operations starter kit for OPC founders"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Intelligent Finance Workspace Contributors"}]
dependencies = ["openpyxl>=3.1,<4", "pypdf>=5,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]

[project.scripts]
opc-finance-box = "src.cli:main"
opc-finance-workbench = "src.server:main"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.data-files]
"share/opc-finance-box/packs/connectors/custom_api" = ["packs/connectors/custom_api/*.json"]
"share/opc-finance-box/packs/connectors/file_import" = ["packs/connectors/file_import/*.json"]
"share/opc-finance-box/packs/connectors/stripe" = ["packs/connectors/stripe/*.json", "packs/connectors/stripe/*.py"]
